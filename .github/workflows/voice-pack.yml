name: Voice pack

# Downloads the voice blocks made on ElevenLabs (links in audio/manifest-en.json, valid for some
# hours), cuts them into one clip per sentence (tools/audio-split.py, script audio/roteiro-en.json)
# and saves the clips and their map on this branch: native/midia/voz-en, web/src/voz-en.json.
on:
  push:
    branches: [proxima-versao]
    paths: ['audio/manifest-en.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-pack
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proxima-versao

      # The ElevenLabs links last a few hours: the blocks are kept in a pre-release (never "latest",
      # so it never reaches the app), and later runs take them from there.
      - name: Get the voice blocks (and keep them)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v ffprobe > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          python3 tools/audio-pack.py audio/manifest-en.json pack || true
          if [ -s pack/ForNow-audios.zip ] && ! grep -q '^FALTOU' pack/relatorio.txt; then
            gh release view vozes-en-fontes --repo "${{ github.repository }}" > /dev/null 2>&1 || \
              gh release create vozes-en-fontes --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --latest=false \
                --title "For Now - English voice blocks (sources)" --notes "The English voice blocks as made on ElevenLabs, kept to cut them again. Not a version of the app."
            gh release upload vozes-en-fontes pack/ForNow-audios.zip --clobber --repo "${{ github.repository }}"
          else
            rm -rf pack && mkdir -p pack
            gh release download vozes-en-fontes --repo "${{ github.repository }}" --pattern ForNow-audios.zip --dir pack
            (cd pack && unzip -q -o ForNow-audios.zip -d ForNow-audios)
            echo "blocks taken from the pre-release vozes-en-fontes (links expired)" > pack/relatorio.txt
          fi

      - name: Cut the English voices into one clip per sentence
        run: |
          python3 tools/audio-split.py pack/ForNow-audios split audio/roteiro-en.json
          python3 tools/audio-vozes.py split en
          { cat pack/relatorio.txt; echo; cat split/divisao.txt; } > audio/vozes-en-relatorio.txt

      - name: Save on this branch
        run: |
          git add native/midia/voz-en web/src/voz-en.json audio/vozes-en-relatorio.txt
          if ! git diff --cached --quiet; then
            git -c user.name="For Now build" -c user.email="build@users.noreply.github.com" commit -qm "English voices for the app (voice pack ${{ github.run_number }})"
            for i in 1 2 3; do git pull -q --rebase origin proxima-versao && git push -q origin HEAD:proxima-versao && break; sleep 5; done
          fi
